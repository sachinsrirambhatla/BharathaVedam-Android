name: Build Bharatha Vedam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -q "$ZIP_FILE" -d project

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BharathaVedam-debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
